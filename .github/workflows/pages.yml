name: Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pinned Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm --prefix source ci

      - name: Build production static site
        run: npm --prefix source run build

      - name: Check source and exported site
        run: npm --prefix source run check

      # Pull requests need no Pages API access or pre-existing Pages configuration.
      - name: Upload checked production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@v4
